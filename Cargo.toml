[workspace]
members = ["crates/timer-core", "crates/timer-storage", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0-beta.6"
edition = "2021"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
timer-core = { path = "crates/timer-core" }
timer-storage = { path = "crates/timer-storage" }
